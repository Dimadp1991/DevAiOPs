{{- if .Values.prometheusRules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aiops-alerts
  namespace: {{ .Values.prometheusRules.namespace }}
  labels:
    app.kubernetes.io/part-of: aiops-platform
    release: {{ .Values.prometheusRules.releaseLabel }}
spec:
  groups:
    - name: aiops.pod
      rules:
        - alert: KubePodCrashLooping
          expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[1m]) >= 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{`{{ $labels.pod }}`}} is crash looping in {{`{{ $labels.namespace }}`}}"
        - alert: KubePodNotReady
          expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"}) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{`{{ $labels.pod }}`}} not ready in {{`{{ $labels.namespace }}`}}"
    - name: aiops.gpu
      rules:
        - alert: GPUHighUtilization
          expr: custom_gpu_utilization_percent > 90
          for: 5s
          labels:
            severity: warning
          annotations:
            summary: "GPU utilization above 90% on {{`{{ $labels.Hostname }}`}}"
        - alert: GPUXIDError
          expr: DCGM_FI_DEV_XID_ERRORS > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "GPU XID error on {{`{{ $labels.Hostname }}`}}"
    - name: aiops.llm
      rules:
        - alert: LLMServiceDown
          expr: up{job=~".*aiops-llm.*"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "AIOps LLM endpoint at {{ .Values.llmApiUrl }} is down or failing to scrape"
        - alert: LLMHighQueueDepth
          expr: vllm:num_requests_waiting > 5
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: "LLM model '{{`{{ $labels.model_name }}`}}' request queue is backing up ({{`{{ $value }}`}} requests waiting)"
        - alert: LLMGPUCacheSaturated
          expr: vllm:gpu_cache_usage_perc > 0.90
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "LLM GPU KV-cache usage is critically high at {{`{{ $value | humanizePercentage }}`}} for model '{{`{{ $labels.model_name }}`}}'"
    - name: jenkins-pod-availability
      rules:
        - alert: JenkinsDown
          expr: up{job=~".*jenkins.*"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Jenkins instance is down"
            description: "Jenkins pod has been down or unreachable for more than 2 minutes."
    - name: argocd-availability
      rules:
        - alert: ArgoCDServerDown
          expr: up{job=~".*argocd-server.*"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Argo CD Server is down"
            description: "The Argo CD API server target has been unreachable for more than 2 minutes."
{{- end }}

{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.secretName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/part-of: aiops-platform
type: Opaque
stringData:
  DATABASE_URL: {{ include "aiops-platform.databaseUrl" . | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.name }}-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/part-of: aiops-platform
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
{{- end }}

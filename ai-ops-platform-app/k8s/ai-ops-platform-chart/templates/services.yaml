apiVersion: v1
kind: Service
metadata:
  name: aiops-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    app: aiops-backend
    app.kubernetes.io/part-of: aiops-platform
spec:
  type: ClusterIP
  selector:
    app: aiops-backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-ui
  namespace: {{ .Values.global.namespace }}
  labels:
    app: aiops-ui
    app.kubernetes.io/part-of: aiops-platform
spec:
  type: ClusterIP
  selector:
    app: aiops-ui
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP

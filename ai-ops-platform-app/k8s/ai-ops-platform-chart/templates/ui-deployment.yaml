apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-ui
  namespace: {{ .Values.global.namespace }}
  labels:
    app: aiops-ui
    app.kubernetes.io/part-of: aiops-platform
spec:
  replicas: {{ .Values.ui.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: aiops-ui
  template:
    metadata:
      labels:
        app: aiops-ui
    spec:
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: AIOPS_API_URL
              value: {{ .Values.ui.env.apiUrl | quote }}
            {{- if .Values.pythonDeps.enabled }}
            - name: PYTHONPATH
              value: "/pvc/site-packages"
            {{- end }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          {{- if .Values.pythonDeps.enabled }}
          volumeMounts:
            - name: python-deps-volume
              mountPath: /pvc
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- if .Values.pythonDeps.enabled }}
      volumes:
        - name: python-deps-volume
          persistentVolumeClaim:
            claimName: {{ .Values.pythonDeps.pvcName }}
      {{- end }}

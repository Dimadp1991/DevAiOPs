apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-llm-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'http://gogs.gogs.svc.cluster.local:3000/gogs/ai-ops-llm-model.git'
    targetRevision: main
    path: aiops-llm-chart
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: devops-core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
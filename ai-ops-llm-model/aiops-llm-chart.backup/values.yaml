# Default values for aiops-llm chart.

replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: zot.local/aiops-vllm-qwen
  tag: v0.6.3
  pullPolicy: IfNotPresent

model:
  name: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
  maxModelLen: 8192
  gpuMemoryUtilization: 0.8

persistence:
  existingClaim: "shared-model-pvc"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# WSL2 GPU Passthrough Configuration
gpu:
  enabled: true
  wslPath: /usr/lib/wsl

resources:
  limits:
    # Removed nvidia.com/gpu to prevent FailedScheduling on WSL2 nodes
    cpu: "4"
    memory: "8Gi"
  requests:
    cpu: "2"
    memory: "4Gi"

ingress:
  enabled: true
  annotations: {}
  hosts:
    - host: aiops-llm.local
      paths:
        - path: /
          pathType: Prefix

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
    additionalLabels:
      release: prometheus

probes:
  readiness:
    initialDelaySeconds: 120
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 300
    periodSeconds: 15
apiVersion: v1
kind: Namespace
metadata:
  name: gogs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gogs-pvc
  namespace: gogs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gogs
  namespace: gogs
  labels:
    app.kubernetes.io/name: gogs
    app.kubernetes.io/instance: gogs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gogs
      app.kubernetes.io/instance: gogs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gogs
        app.kubernetes.io/instance: gogs
    spec:
      containers:
        - name: gogs
          image: gogs/gogs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
            - containerPort: 22
              name: ssh
              protocol: TCP
          env:
            - name: SOCAT_LINK
              value: "false"
            - name: RUN_MODE
              value: "prod"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: gogs-data
              mountPath: /data
      volumes:
        - name: gogs-data
          persistentVolumeClaim:
            claimName: gogs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gogs
  namespace: gogs
  labels:
    app.kubernetes.io/name: gogs
    app.kubernetes.io/instance: gogs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gogs
    app.kubernetes.io/instance: gogs
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
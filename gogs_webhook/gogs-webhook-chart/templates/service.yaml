apiVersion: v1
kind: Service
metadata:
  name: {{ include "gogs-webhook.fullname" . }}-service
  labels:
    {{- include "gogs-webhook.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "gogs-webhook.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}